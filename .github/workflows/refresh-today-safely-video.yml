name: Refresh Today Safely video links

on:
  push:
    paths:
      - '.github/workflows/refresh-today-safely-video.yml'

permissions:
  contents: write

jobs:
  replace-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Replace YouTube links in site and PDF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = b'https://youtu.be/T-KucWuOlwI'
          new = b'https://youtu.be/4WmyT-zsGJE'
          assert len(old) == len(new)
          targets = {
              'today-safely.html': 2,
              'index.html': None,
              '오늘도무사히_1인Ai 개발 프로젝트_1차 기획포트폴리오.pdf': 1,
          }
          for filename, expected_count in targets.items():
              path = Path(filename)
              data = path.read_bytes()
              count = data.count(old)
              if expected_count is not None and count not in (expected_count, 0):
                  raise RuntimeError(f'Unexpected link count in {filename}: {count}')
              if expected_count is not None and count == 0 and new not in data:
                  raise RuntimeError(f'Missing video link in {filename}')
              path.write_bytes(data.replace(old, new))
              print(f'{filename}: replaced {count}, new total {path.read_bytes().count(new)}')
          PY
      - name: Commit updated site and PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "today-safely.html" "index.html" "오늘도무사히_1인Ai 개발 프로젝트_1차 기획포트폴리오.pdf"
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Update Today Safely YouTube link in site and PDF"
          git push
