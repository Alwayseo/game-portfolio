name: Portfolio Cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove placeholder project and preview button
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['PROJECT 03','구성 미리보기']:
              i=s.find(term)
              print(term,i,s[max(0,i-400):i+400])
          PY
