name: Portfolio Cleanup
on:
  push:
    paths:
      - '.github/workflows/portfolio-cleanup.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact HTML markup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['PROJECT 03','구성 미리보기']:
              i=s.find(term)
              print('MARKER',term,'INDEX',i)
              print(s[max(0,i-2000):i+2500])
          PY
