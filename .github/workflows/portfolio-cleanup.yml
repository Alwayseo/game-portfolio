name: Portfolio Cleanup
on:
  push:
    paths:
      - '.github/workflows/portfolio-cleanup.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove third card and preview link on page load
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- portfolio-2026-cleanup -->'
          if marker not in s:
              script=r'''<!-- portfolio-2026-cleanup -->
          <script>
          document.addEventListener('DOMContentLoaded', () => {
            const normalized = el => (el.textContent || '').replace(/\s+/g, ' ').trim();
            document.querySelectorAll('a, button').forEach(el => {
              if (normalized(el).includes('구성 미리보기')) el.remove();
            });
            const candidates = [...document.querySelectorAll('article, li, div')].filter(el =>
              normalized(el).includes('PROJECT 03') &&
              !normalized(el).includes('PROJECT 02') &&
              !normalized(el).includes('PROJECT 01')
            );
            const matches = candidates.filter(el => !el.parentElement ||
              normalized(el.parentElement).includes('PROJECT 02') ||
              normalized(el.parentElement).includes('PROJECT 01'));
            const card = matches.sort((a,b)=>normalized(a).length-normalized(b).length)[0] ||
              candidates.sort((a,b)=>normalized(b).length-normalized(a).length)[0];
            if (card) card.remove();
          });
          </script>'''
              assert '</body>' in s.lower(), 'Missing body end'
              import re
              s,n=re.subn(r'</body\s*>',lambda m: script+'\n'+m.group(0),s,count=1,flags=re.I)
              assert n==1
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Remove third placeholder card and preview button"
            git push
          fi
