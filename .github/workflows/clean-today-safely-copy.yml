name: Clean Today Safely portfolio copy

on:
  push:
    paths:
      - '.github/workflows/clean-today-safely-copy.yml'

permissions:
  contents: write

jobs:
  clean-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove assistant-style progress notices from project details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          notice1 = '<div class="runner-note">개발 기록에는 실제 플레이 화면과 아직 구현하지 않은 시안이 함께 있습니다. 상세 소개에서는 이미지마다 그 상태를 구분했고, 최종 공개 전에는 현재 빌드와 문서의 상태를 다시 맞추는 것이 좋습니다.</div>'
          notice2 = '<p class="runner-status">현재 구성은 제출된 기획서와 개발 기록을 바탕으로 한 웹사이트 추가 시안입니다. 통합 플레이 영상은 YouTube에서 확인할 수 있습니다. 최신 빌드 배포 링크는 아직 연결하지 않았습니다.</p>'
          old_lead = '<p class="runner-lead">초기 문서는 ‘사건 수습률과 결말’을 강조했습니다. 이후 제공된 최신 기획서는 생존·피버·보스·수집을 체계적으로 설명합니다. 개발 기록은 그 사이의 결정과 보완을 보여 줍니다.</p>'
          new_lead = '<p class="runner-lead">초기에는 사건 수습률과 결말을 중심으로 구상했습니다. 이후 생존·피버·보스·수집의 역할과 보상을 구분하며, 플레이어가 상황에 따라 다른 판단을 하도록 설계 방향을 구체화했습니다.</p>'
          for name in ('index.html','today-safely.html'):
              p=Path(name)
              original=p.read_text(encoding='utf-8')
              for fragment, count in ((notice1,1),(notice2,1),(old_lead,1)):
                  actual=original.count(fragment)
                  assert actual==count,f'{name}: expected {count} instance(s), found {actual} for {fragment[:70]}'
              changed=(original.replace(notice1,'')
                               .replace(notice2,'')
                               .replace(old_lead,new_lead))
              for fragment in (notice1,notice2,old_lead):
                  assert fragment not in changed
              assert changed.count('https://youtu.be/4WmyT-zsGJE') == original.count('https://youtu.be/4WmyT-zsGJE')
              assert changed.count('기획 포트폴리오 PDF 보기') == original.count('기획 포트폴리오 PDF 보기')
              assert changed.count('id="runner-dialog"') == original.count('id="runner-dialog"')
              p.write_text(changed,encoding='utf-8')
              print(f'{name}: removed 2 meta notices; revised design-process description. Size {len(original)} -> {len(changed)}')
          PY
      - name: Commit cleaned HTML files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html today-safely.html
          git diff --cached --stat
          git commit -m "Remove editorial progress notices from Today Safely portfolio"
          git push
