name: Reposition Today Safely video and PDF buttons
on:
  push:
    paths:
      - '.github/workflows/reposition-today-safely-links.yml'

permissions:
  contents: write

jobs:
  reposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show video and PDF buttons at start and remove bottom duplicates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          video = 'https://youtu.be/4WmyT-zsGJE'
          pdf = '오늘도무사히_1인Ai 개발 프로젝트_1차 기획포트폴리오.pdf'
          assert Path(pdf).is_file(), 'Existing PDF must be present'
          css = """
          .runner-hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
          .runner-hero-actions .runner-video-hero-link{margin-top:0}
          .runner-pdf-hero-link{display:inline-flex;align-items:center;min-height:45px;text-decoration:none;padding:12px 18px;border:1px solid #b4ddec;border-radius:100px;background:#fff;color:#2377ac;font-size:13px;font-weight:900;box-shadow:0 8px 19px #2c7eaf14}
          .runner-pdf-hero-link:hover{background:#edf8ff}
          """
          hero_video = f'<a class="runner-video-hero-link" href="{video}" target="_blank" rel="noopener noreferrer">▶ 전체 플레이 영상 보기 ↗</a>'
          hero_actions = (f'<div class="runner-hero-actions">{hero_video}'
                          f'<a class="runner-pdf-hero-link" href="{pdf}" target="_blank" rel="noopener noreferrer">기획서 PDF 보기 ↗</a></div>')
          css_anchor = '.runner-video-hero-link:hover{background:#185f8d}'
          bottom_pattern = (r'<div class="runner-links" style="margin-top:24px">\s*'
                            + re.escape(f'<a href="{video}"')
                            + r'.*?' + re.escape(f'<a href="{pdf}"')
                            + r'.*?</div>')

          for name in ('index.html','today-safely.html'):
              path = Path(name)
              original = path.read_text(encoding='utf-8')
              assert original.count(hero_video)==1, f'{name}: hero link count {original.count(hero_video)}'
              assert original.count(css_anchor)==1, f'{name}: CSS anchor missing or repeated'
              updated, bottom_count = re.subn(bottom_pattern, '', original, flags=re.DOTALL)
              assert bottom_count==1, f'{name}: bottom two-button block count {bottom_count}'
              updated = updated.replace(hero_video, hero_actions, 1)
              updated = updated.replace(css_anchor, css_anchor + '\n' + css, 1)
              assert updated.count('class="runner-hero-actions"')==1
              assert updated.count('class="runner-pdf-hero-link"')==1
              assert updated.count(f'href="{pdf}"')==1
              assert updated.count(f'href="{video}"') >= 1
              assert 'class="runner-links" style="margin-top:24px"' not in updated
              path.write_text(updated,encoding='utf-8')
              print(name,'OK:',len(original),'->',len(updated),'bytes; top two links, bottom removed')
          PY
      - name: Commit only the two HTML pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html today-safely.html
          git diff --cached --stat
          git commit -m "Move Today Safely video and PDF links to project intro"
          git push
