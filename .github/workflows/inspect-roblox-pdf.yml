name: Update Roblox PDF preview
on:
  push:
    paths:
      - '.github/workflows/inspect-roblox-pdf.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change first Roblox PDF button to new tab viewing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path('index.html')
          s = file.read_text(encoding='utf-8')
          old = '<a class="exit4-pdf" download="Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf" href="Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf">Stage A 기획서 PDF 보기<span>↗</span></a>'
          new = '<a class="exit4-pdf" href="Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf" target="_blank" rel="noopener noreferrer">Stage A 기획서 PDF 보기<span>↗</span></a>'
          assert s.count(old) == 1, f'Unexpected number of matching buttons: {s.count(old)}'
          assert Path('Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf').is_file(), 'PDF missing'
          s = s.replace(old, new)
          file.write_text(s, encoding='utf-8')
          assert s.count(new) == 1
          print('Roblox PDF preview button changed successfully.')
          print('Bottom PDF save button untouched:', '기획서 PDF 저장' in s)
          PY
      - name: Commit the single HTML change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Open Roblox Stage A planning PDF in a new tab"
          git push
