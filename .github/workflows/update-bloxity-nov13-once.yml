name: Update Bloxity proposal once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-bloxity-nov13-once.yml']
permissions:
  contents: write
concurrency:
  group: update-bloxity-nov13-once
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved proposal
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 'https://drive.google.com/uc?export=download&id=1f1qwT2IecyF8KOsLmObmUct0ZufQhcyF' --output 'Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf'
          echo '0495d970aff774c703a20b9937f1e2a4494819b78a1bd75be2aa197ffe104aad  Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf' | sha256sum -c -
          test "$(stat -c%s 'Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf')" = 5508891
      - name: Apply reviewed content and remove temporary files
        run: |
          set -euo pipefail
          echo 'fa21dbd8e974f0874a248b5556863b9303db13b719b35347b02793b16635a62f  index.html' | sha256sum -c -
          echo 'bffaf922c1ca7351a9ed7019fe40271d0c944411bba31af38a19080e365c85e3  assets/readability.js' | sha256sum -c -
          base64 -d .bloxity-nov13.patch.gz.b64 | gzip -d > /tmp/bloxity.patch
          git apply --check --unidiff-zero /tmp/bloxity.patch
          git apply --unidiff-zero /tmp/bloxity.patch
          echo 'a765c8d4cf9329d444430e860d3828f51bed85a72c16b80b39d198ba7d2461f7  index.html' | sha256sum -c -
          echo 'c940c202d1cb66d676d9caaa1bc2a7286d54bd46c7f961e2267ca3aab0b318c0  assets/readability.js' | sha256sum -c -
          node --check assets/readability.js
          git rm .bloxity-nov13.patch.gz.b64 .github/workflows/update-bloxity-nov13-once.yml
          git add index.html assets/readability.js 'Let_Me_Escape_from_Bloxity_StageA_게임기획_포트폴리오_V29.pdf'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Bloxity to revised 38-page proposal and design case study'
          git push origin HEAD:main
