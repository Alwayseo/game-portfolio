name: Update Today Safely portfolio once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-today-safely-once.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact source files and verify SHA256
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, shutil
          from pathlib import Path
          original = {'index.html': 'd72931278d3ecd9631173210f9302c4bfd603621e599a71d97d6ca3e98c4aff6', 'today-safely.html': '056336707927f93e929cc9d2b6b7bcc38daea2b5be098d9c3d07fc00c9510d6f'}
          for name, expected in original.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, 'Existing page changed: ' + name
          manifest = json.loads(Path('.portfolio-upload/manifest.json').read_text())
          expected_names = {'오늘도무사히_기획포트폴리오(서예종).pdf', 'index.html', 'today-safely.html'}
          assert {item['target'] for item in manifest} == expected_names
          prepared = []
          for item in manifest:
              data = b''.join(Path(part['path']).read_bytes() for part in item['parts'])
              assert len(data) == item['size'], 'Size mismatch'
              assert hashlib.sha256(data).hexdigest() == item['sha256'], 'SHA256 mismatch'
              prepared.append((item['target'], data))
          for name, data in prepared:
              Path(name).write_bytes(data)
              print('Verified and installed:', name, hashlib.sha256(data).hexdigest())
          Path('오늘도무사히_1인Ai 개발 프로젝트_1차 기획포트폴리오.pdf').unlink()
          shutil.rmtree('.portfolio-upload')
          PYCODE
      - name: Commit verified portfolio and remove transfer parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html today-safely.html '오늘도무사히_기획포트폴리오(서예종).pdf' '오늘도무사히_1인Ai 개발 프로젝트_1차 기획포트폴리오.pdf' .portfolio-upload
          git commit -m "Update Today Safely PDF and project introduction"
          git push origin HEAD:main
