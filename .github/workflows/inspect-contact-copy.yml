name: Remove redundant caption and enable contact email copy
on:
  push:
    paths: ['.github/workflows/inspect-contact-copy.yml']
permissions:
  contents: write
jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit email card interaction and remove caption
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          before=p.read_text(encoding='utf-8')
          footnote='<p class="project-footnote reveal">✧ 5인 팀 프로젝트 · Stage A 레벨/퀘스트/이벤트·보스 콘셉트 기획</p>'
          anchor='<a class="contact-method" href="mailto:kj1301975@naver.com"><span class="contact-method-icon">✉</span><span><small>E-MAIL</small><strong>kj1301975@naver.com</strong></span><b aria-hidden="true">↗</b></a>'
          replacement='<button class="contact-method" id="copy-contact-email" type="button" title="이메일 주소 복사" aria-label="kj1301975@naver.com 이메일 주소 복사"><span class="contact-method-icon">✉</span><span><small id="contact-copy-feedback" aria-live="polite">E-MAIL</small><strong>kj1301975@naver.com</strong></span><b aria-hidden="true" id="contact-copy-icon">⧉</b></button>'
          assert before.count(footnote)==1, f'Redundant caption occurrences: {before.count(footnote)}'
          assert before.count(anchor)==1, f'Contact email link occurrences: {before.count(anchor)}'
          assert before.count('</body>')==1
          assert 'copy-contact-email' not in before
          after=before.replace(footnote,'',1).replace(anchor,replacement,1)
          extra_css='<style id="contact-copy-style">#copy-contact-email{font:inherit;cursor:pointer;text-align:left;appearance:none}#copy-contact-email:focus-visible{outline:3px solid #257ab9;outline-offset:4px}#contact-copy-feedback{transition:color .18s}#copy-contact-email.is-copied #contact-copy-feedback{color:#15806b}#copy-contact-email.is-copied #contact-copy-icon{color:#15806b}</style>'
          extra_js=r"""<script id="contact-copy-behavior">
          (() => {
            const button = document.getElementById('copy-contact-email');
            const feedback = document.getElementById('contact-copy-feedback');
            const icon = document.getElementById('contact-copy-icon');
            if (!button || !feedback || !icon) return;
            const email = 'kj1301975@naver.com';
            let resetTimer;
            const copyFallback = () => {
              const temporary = document.createElement('textarea');
              temporary.value = email;
              temporary.setAttribute('readonly', '');
              temporary.style.position = 'fixed';
              temporary.style.opacity = '0';
              document.body.appendChild(temporary);
              temporary.select();
              const succeeded = document.execCommand('copy');
              temporary.remove();
              if (!succeeded) throw new Error('Clipboard copy failed');
            };
            button.addEventListener('click', async () => {
              clearTimeout(resetTimer);
              let succeeded = false;
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  await navigator.clipboard.writeText(email);
                } else {
                  copyFallback();
                }
                succeeded = true;
              } catch (error) {
                try {
                  copyFallback();
                  succeeded = true;
                } catch (fallbackError) {
                  succeeded = false;
                }
              }
              button.classList.toggle('is-copied', succeeded);
              feedback.textContent = succeeded ? '복사됨 ✓' : '복사 실패';
              icon.textContent = succeeded ? '✓' : '⧉';
              resetTimer = window.setTimeout(() => {
                button.classList.remove('is-copied');
                feedback.textContent = 'E-MAIL';
                icon.textContent = '⧉';
              }, 2500);
            });
          })();
          </script>"""
          after=after.replace('</body>', extra_css+'\n'+extra_js+'\n</body>',1)
          assert after.count(footnote)==0
          assert after.count('id="copy-contact-email"')==1
          assert after.count('contact-copy-behavior')==1
          assert after.count('https://youtu.be/4WmyT-zsGJE')==before.count('https://youtu.be/4WmyT-zsGJE')
          assert after.count('https://youtu.be/THuuQ30fbc8')==before.count('https://youtu.be/THuuQ30fbc8')
          p.write_text(after,encoding='utf-8')
          print('Caption removed, email copy enabled; preserved both project video URLs.')
          print('Existing bytes:',len(before.encode('utf-8')),'Updated bytes:',len(after.encode('utf-8')))
          PY
      - name: Commit main homepage change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git diff --cached --stat
          git commit -m "Remove redundant Stage A caption and copy contact email on click"
          git push
