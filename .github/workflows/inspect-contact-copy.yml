name: Inspect contact email and footnote
on:
  push:
    paths: ['.github/workflows/inspect-contact-copy.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing footer and mail link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['project-footnote','kj1301975@naver.com','mailto:','contact-email','contact-card','맨 위로 올라가기','copy-email','contact-section']:
              matches=list(re.finditer(re.escape(term),s,re.IGNORECASE))
              print('TERM',repr(term),'TOTAL',len(matches))
              for m in matches[:9]:
                  print('OFFSET',m.start(),'CONTEXT',repr(s[max(0,m.start()-420):min(len(s),m.end()+520)]))
          PY
